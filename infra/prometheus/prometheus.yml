global:
  # 2s is aggressive for production; it lets demo graphs react within seconds.
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:3000']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
