name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly load test
  workflow_dispatch:

concurrency:
  # Per event type, so a manual run doesn't cancel the push run on the same ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: integration tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: poolside
          POSTGRES_PASSWORD: poolside
          POSTGRES_DB: poolside
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poolside"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: poolside
      PGPASSWORD: poolside
      PGDATABASE: poolside
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: MIGRATIONS_DIR=db/migrations sh db/migrate.sh
      - run: npm run test:integration

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  # Nightly / manual: the whole stack under a slow payments provider.
  # k6 thresholds (error rate, per-endpoint p95) fail the job, which catches
  # regressions such as network I/O moving back inside a transaction.
  load-test:
    name: load test (slow provider)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TX_STRATEGY: release
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait api downstream
      - run: mkdir -p docs/evidence/tmp # k6 writes its summary here
      - run: docker compose run --rm k6 run /load/slow-downstream.js
      - if: always()
        run: docker compose logs api --tail 200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: docs/evidence/tmp/
