name: poolside

x-pg-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER:-poolside}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poolside}
  POSTGRES_DB: ${POSTGRES_DB:-poolside}

services:
  postgres:
    image: postgres:16-alpine
    environment: *pg-env
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-poolside}
      PGPASSWORD: ${POSTGRES_PASSWORD:-poolside}
      PGDATABASE: ${POSTGRES_DB:-poolside}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      migrate: { condition: service_completed_successfully }
      downstream: { condition: service_started }
    environment:
      PORT: 3000
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-poolside}
      PGPASSWORD: ${POSTGRES_PASSWORD:-poolside}
      PGDATABASE: ${POSTGRES_DB:-poolside}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DOWNSTREAM_URL: http://downstream:4001
    ports: ["3000:3000"]

  downstream:
    build: { context: ., dockerfile: apps/downstream/Dockerfile }
    environment:
      PORT: 4001
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
      DOWNSTREAM_LATENCY_MS: ${DOWNSTREAM_LATENCY_MS:-50}
      DOWNSTREAM_JITTER_MS: ${DOWNSTREAM_JITTER_MS:-20}
    ports: ["4001:4001"]

volumes:
  pgdata:
