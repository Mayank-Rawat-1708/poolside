name: poolside

x-pg-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER:-poolside}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poolside}
  POSTGRES_DB: ${POSTGRES_DB:-poolside}

services:
  postgres:
    image: postgres:16-alpine
    environment: *pg-env
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-poolside}
      PGPASSWORD: ${POSTGRES_PASSWORD:-poolside}
      PGDATABASE: ${POSTGRES_DB:-poolside}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      downstream: { condition: service_started }
    environment:
      PORT: 3000
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-poolside}
      PGPASSWORD: ${POSTGRES_PASSWORD:-poolside}
      PGDATABASE: ${POSTGRES_DB:-poolside}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_ACQUIRE_TIMEOUT_MS: ${DB_ACQUIRE_TIMEOUT_MS:-1000}
      DB_IDLE_IN_TX_TIMEOUT_MS: ${DB_IDLE_IN_TX_TIMEOUT_MS:-10000}
      TX_STRATEGY: ${TX_STRATEGY:-hold}
      DOWNSTREAM_URL: http://downstream:4001
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
      OTEL_SERVICE_NAME: poolside-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10

  downstream:
    build: { context: ., dockerfile: apps/downstream/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 4001
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
      DOWNSTREAM_LATENCY_MS: ${DOWNSTREAM_LATENCY_MS:-50}
      DOWNSTREAM_JITTER_MS: ${DOWNSTREAM_JITTER_MS:-20}
    ports: ["4001:4001"]

  console:
    build: { context: ., dockerfile: apps/console/Dockerfile }
    restart: unless-stopped
    depends_on: [api, downstream, prometheus]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
    # Loopback only: the console proxies admin calls with the token attached.
    ports: ["127.0.0.1:8080:80"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  # Exposes pg_stat_activity counts by state (and more) to Prometheus.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-poolside}:${POSTGRES_PASSWORD:-poolside}@postgres:5432/${POSTGRES_DB:-poolside}?sslmode=disable

  grafana:
    image: grafana/grafana:12.1.0
    depends_on: [prometheus]
    environment:
      # Local demo only: anonymous read access, no login wall.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

  # All-in-one Jaeger v2 accepts OTLP directly; no separate collector needed here.
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP/HTTP

  # One-shot load generator: `docker compose run --rm k6 run /load/spike.js`
  k6:
    image: grafana/k6:2.3.0
    profiles: ["tools"]
    environment:
      API_URL: http://api:3000
      DOWNSTREAM_URL: http://downstream:4001
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
      RESULTS_DIR: ${RESULTS_DIR:-/results/tmp}
      SUMMARY_NAME: ${SUMMARY_NAME:-}
    volumes:
      - ./load:/load:ro
      - ./docs/evidence:/results

volumes:
  pgdata:
